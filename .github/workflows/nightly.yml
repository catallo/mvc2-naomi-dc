name: Nightly

# Every night, when main has changed: release.yml's packages of main, as the pre-release LATEST-nightly (0.6.2-nightly after
# 0.6.2), replacing the last nightly. A release made with the workflow's token starts no other workflow.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          latest=$(gh release view --json tagName -q .tagName)
          version="$latest-nightly"
          built=$(gh api "repos/$GH_REPO/git/ref/tags/$version" -q .object.sha 2> /dev/null || true)
          if [ "$EVENT" = schedule ] && [ "$built" = "$GITHUB_SHA" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/release.yml
    # release.yml's own publish job asks for it, though it doesn't run here
    permissions:
      contents: write
    with:
      version: ${{ needs.check.outputs.version }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mvc2-*
          merge-multiple: true
          path: assets

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cat > notes.md <<EOF
          **Nightly build: untested, for trying what's new.** Built from \`main\` at ${GITHUB_SHA::7} on $(date -u +%F). It can have
          bugs the releases don't; for playing, take the [latest release](https://github.com/$GH_REPO/releases/latest).

          ## Install

          - **Windows:** unzip \`mvc2-windows-$VERSION.zip\` anywhere and run \`mvc2.exe\`. Put your \`mvsc2.zip\` in \`roms/mvsc2\` beside it, and/or your USA Dreamcast disc (a CHD, GDI, CUE/BIN or ISO image, or its files) in \`disc\`. \`PLAYING.md\` has the keys and settings. Upgrading: copy your \`roms\` and \`disc\` folders, \`mvc2.cfg\` and saves (\`backup.bin\`, \`eeprom.bin\`, \`vmu_save_A1.bin\`) into the new folder.
          - **3DS:** copy the zip's \`sd\` folder to the root of the SD card and install \`mvc2.cia\` with FBI. Put your \`mvsc2.zip\` in \`sdmc:/3ds/mvc2/roms/mvsc2/\`, and/or the disc (an image, or its files) in \`sdmc:/3ds/mvc2/disc/\`. Sound needs \`sdmc:/3ds/dspfirm.cdc\` (dump it with DSP1).
          - **PSP:** copy the zip's \`PSP\` folder to the root of the memory stick, so the game is in \`ms0:/PSP/GAME/MVC2/\`, and put your USA Dreamcast disc in \`ms0:/PSP/GAME/MVC2/disc/\`: a CHD, GDI, CUE/BIN or ISO image, or its files.
          - **MiSTer:** install the Pinedra GPU core first (release 20261115 or later). Then copy \`mvc2-mister-$VERSION.tar.gz\` and \`mvc2_setup.sh\` into \`/media/fat/Scripts\` and run \`mvc2_setup\` from the Scripts menu. Put your \`mvsc2.zip\` in \`/media/fat/games/mvc2/roms/mvsc2/\`, and/or your USA Dreamcast disc in \`/media/fat/games/mvc2/disc/\`, and start "MVC2 Arcade (Pinedra)" or "MVC2 Dreamcast (Pinedra)" under _Other.

          The first start unpacks \`mvsc2.zip\` into \`mvsc2.bin\` in the same folder (136 MB, once).

          **No game data included.**
          EOF
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep -- '-nightly$'); do
            gh release delete "$tag" --yes --cleanup-tag
          done
          gh release create "$VERSION" assets/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "$VERSION ($(date -u +%F))" --notes-file notes.md
